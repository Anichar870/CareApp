name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
          cache-disabled: true

      - name: Build Debug APK
        run: |
          echo "=== Searching for project files ==="
          SETTINGS_PATH=$(find . -name "settings.gradle*" | head -n 1)

          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: Could not find settings.gradle.kts anywhere in this repository!"
            echo "Here is what files you currently have:"
            find . -maxdepth 3 -not -path '*/.*'
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          echo "Found project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HealthAssistant-APK
          path: "**/build/outputs/apk/debug/*.apk"
